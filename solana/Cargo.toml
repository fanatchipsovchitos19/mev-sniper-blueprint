[package]
name = "mev_sniper_solana"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
solana-client = "2.2"
solana-sdk = "2.2"
solana-program = "2.2"
solana-transaction-status = "2.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"